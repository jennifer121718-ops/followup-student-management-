<!doctype html><html lang="ja"><meta charset="utf-8"><title>初期設定キー作成</title><style>body{font:16px system-ui;max-width:650px;margin:50px auto;padding:20px}button{padding:12px;margin:8px}textarea{width:100%;height:80px}</style><h1>初期設定キーを作成</h1><p>このページはパソコン内だけで動きます。キーを外部に送信しません。</p><button id="make">キーを作成する</button><div id="result" hidden><textarea id="key" readonly></textarea><p>サーバーに置くのは setup-hash.txt だけです。初期設定キーは本人だけが保管してください。</p><button id="hash">setup-hash.txt を保存</button><button id="save">初期設定キー.txt を保存</button></div><p id="error"></p><script>
let key='',hash='';function save(name,value){const url=URL.createObjectURL(new Blob([value+'\n'],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.querySelector('#make').onclick=async()=>{try{key=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(key))),b=>b.toString(16).padStart(2,'0')).join('');document.querySelector('#key').value=key;document.querySelector('#result').hidden=false;}catch(e){document.querySelector('#error').textContent='ChromeまたはEdgeで開いてください。'}};document.querySelector('#hash').onclick=()=>save('setup-hash.txt',hash);document.querySelector('#save').onclick=()=>save('初期設定キー.txt',key);
</script></html>
